name: Optional research experiment
on:
  workflow_dispatch:
jobs:
  toy-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scikit-learn
      - name: All tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Generate a deterministic architecture smoke
        run: |
          PYTHONPATH=src python -m rootforge_skill_surgery.research.experiment \
            --device cpu --seeds 2 --steps 3 --batch-size 8 \
            --hidden 8 --patch-top-k 2 --output runs/ci-smoke
      - name: Save smoke records
        uses: actions/upload-artifact@v4
        with:
          name: research-smoke-results
          path: runs/ci-smoke/
